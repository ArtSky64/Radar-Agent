version: '3.8'

services:
  ai-radar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-radar-scout
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=/app/data/app_database.db
      - LOG_FILE=/app/data/app.log
      - ERROR_LOG_FILE=/app/data/errors.log
      - LOG_LEVEL=INFO
      - VLLM_BASE_URL=http://host.docker.internal:2233/v1
      - VLLM_MODEL_NAME=Qwen/Qwen3.6-27B
      - VLLM_API_KEY=not-needed
      - DUPLICATE_THRESHOLD=0.59
      - VECTOR_DIM=384
    env_file:
      - path: .env
        required: false
    volumes:
      # Постоянное хранилище базы SQLite и логов
      - ./data:/app/data
      # Кэширование весов моделей fastembed для мгновенного перезапуска
      - fastembed_cache:/root/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  fastembed_cache:
